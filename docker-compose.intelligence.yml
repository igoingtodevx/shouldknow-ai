services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shouldknow
      POSTGRES_USER: shouldknow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - shouldknow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shouldknow -d shouldknow"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: intelligence/service/Dockerfile
    command: ["uvicorn","app:app","--host","0.0.0.0","--port","8080"]
    environment:
      DATABASE_URL: postgresql://shouldknow:${POSTGRES_PASSWORD:-change-me}@postgres:5432/shouldknow
      SEARXNG_URL: ${SEARXNG_URL}
      CRAWL4AI_ENDPOINT: ${CRAWL4AI_ENDPOINT}
      AUTO_PUBLISH_P0: ${AUTO_PUBLISH_P0:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: intelligence/service/Dockerfile
    command: ["python","worker.py","once"]
    environment:
      DATABASE_URL: postgresql://shouldknow:${POSTGRES_PASSWORD:-change-me}@postgres:5432/shouldknow
      SEARXNG_URL: ${SEARXNG_URL}
      CRAWL4AI_ENDPOINT: ${CRAWL4AI_ENDPOINT}
      AUTO_PUBLISH_P0: ${AUTO_PUBLISH_P0:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  shouldknow-postgres:
