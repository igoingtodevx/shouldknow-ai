services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shouldknow
      POSTGRES_USER: shouldknow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - shouldknow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shouldknow -d shouldknow"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./services/intelligence
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://shouldknow:${POSTGRES_PASSWORD}@postgres:5432/shouldknow
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SHOULDKNOW_API_PORT:-8787}:8080"

  worker:
    build: ./services/intelligence
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://shouldknow:${POSTGRES_PASSWORD}@postgres:5432/shouldknow
      SEARXNG_URL: ${SEARXNG_URL}
      CRAWL4AI_URL: ${CRAWL4AI_URL}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      MATERIALITY_THRESHOLD: ${MATERIALITY_THRESHOLD:-45}
      AUTO_PUBLISH: ${AUTO_PUBLISH:-false}
      AUTO_PUBLISH_THRESHOLD: ${AUTO_PUBLISH_THRESHOLD:-78}
      AUTO_PUBLISH_CONFIDENCE: ${AUTO_PUBLISH_CONFIDENCE:-0.84}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-240}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  shouldknow_postgres:
